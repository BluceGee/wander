name: xnl
description: "XNL 工具箱 —— 备忘录、记账、闹钟、小游戏合集"
publish_to: 'none'

version: 1.2.0+4

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 本地键值存储：备忘录、账单、设置均以 JSON 存放于此
  shared_preferences: ^2.3.0
  # 日期与金额格式化
  intl: ^0.20.0
  # AI 助手调用 LLM API（Anthropic Messages 格式）
  http: ^1.2.0
  # 证书指纹固定（自签 HTTPS 校验）
  crypto: ^3.0.0
  flutter_secure_storage: ^11.2.0
  # 闹钟：AlarmManager 精确调度 + 前台服务循环铃声 + 全屏响铃 + 重启补响
  alarm: ^5.15.0
  # 摇一摇关闭：加速度计流（Android 零权限）
  sensors_plus: ^7.1.1
  # 闹钟权限：精确闹钟（Android 12+）与通知（Android 13+）
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
